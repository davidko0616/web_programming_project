<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>게시글 수정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/qna.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="/static/pictures/YMK 로고.png" alt="YMK Logo" id="logoimg" style="cursor: pointer;">
    </div>
    <div class="navbar">
      <ul class="menu-bar">
        <li><a href="{{ url_for('home') }}">Home</a></li>
        <li><a href="{{ url_for('intro') }}">소개</a></li>
        <li><a href="{{ url_for('history') }}">역사</a></li>
        <li><a href="{{ url_for('qna') }}">게시판</a></li>
      </ul>
    </div>
  </header>

  <div class="container py-4">
    <div class="card">
      <div class="card-header">
        <h2 class="mb-0">게시글 수정</h2>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('edit_post', post_id=post.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="name" class="form-label">작성자</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ post.name }}" required>
          </div>

          <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ post.title }}" required>
          </div>

          <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea class="form-control" id="content" name="content" rows="10" required>{{ post.content }}</textarea>
          </div>

          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary me-2">수정 완료</button>
            <a href="{{ url_for('qna') }}" class="btn btn-secondary">취소</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer id="footer-wrap">
    <div class="footer">
      <ul class="sns">
        <li>
          <a href="https://www.instagram.com/ymkofficial/" target="_blank">
            <img alt="instagram" src="/static/pictures/foot-icon02.png">
          </a>
        </li>
        <li>연락처: 010-1234-5678</li>
        <li>Email: ymk@gmail.com</li>
      </ul>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
